<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMembrane — Review UI</title>
<style>
:root {
  --bg: #ffffff;
  --bg-secondary: #f5f5f5;
  --text: #1a1a1a;
  --text-muted: #666666;
  --border: #e0e0e0;
  --accent: #0066cc;
  --success: #1a8a3e;
  --danger: #cc2222;
  --badge-bg: #e8e8e8;
  --tab-active-border: #0066cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --bg-secondary: #252525;
    --text: #e0e0e0;
    --text-muted: #999999;
    --border: #333333;
    --accent: #4da6ff;
    --success: #2ecc71;
    --danger: #e74c3c;
    --badge-bg: #333333;
    --tab-active-border: #4da6ff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 1rem;
  max-width: 1200px;
  margin: 0 auto;
}
h1 { font-size: 1.25rem; margin-bottom: 1rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
.tab-btn {
  padding: 0.5rem 1rem;
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.875rem;
  border-bottom: 2px solid transparent;
  position: relative;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--tab-active-border); font-weight: 600; }
.tab-btn .badge {
  background: var(--danger);
  color: #fff;
  font-size: 0.7rem;
  padding: 0.1rem 0.4rem;
  border-radius: 8px;
  margin-left: 0.3rem;
  vertical-align: top;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.filter-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
.filter-row input, .filter-row select {
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.8rem;
}
.filter-row input { flex: 1; min-width: 150px; }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
th { font-weight: 600; background: var(--bg-secondary); position: sticky; top: 0; }
.table-wrap { overflow-x: auto; }
.memory-toggle { cursor: pointer; border: none; background: none; color: var(--accent); font: inherit; text-align: left; text-decoration: underline; }
.expanded-content { white-space: pre-wrap; word-break: break-word; padding: 0.5rem; background: var(--bg-secondary); }
.badge {
  display: inline-block;
  padding: 0.15rem 0.45rem;
  border-radius: 3px;
  font-size: 0.7rem;
  font-weight: 600;
  background: var(--badge-bg);
  color: var(--text);
}
.badge-coding_rule { background: #dbeafe; color: #1e40af; }
.badge-known_gotcha { background: #fef3c7; color: #92400e; }
.badge-architecture_decision { background: #ede9fe; color: #6b21a8; }
.badge-security_rule { background: #fee2e2; color: #991b1b; }
.badge-testing_rule { background: #d1fae5; color: #065f46; }
.badge-deployment_rule { background: #e0e7ff; color: #3730a3; }
.badge-forbidden_pattern { background: #fce7f3; color: #9d174d; }
.badge-project_fact { background: #f3f4f6; color: #374151; }
.badge-domain_knowledge { background: #ecfdf5; color: #047857; }
.badge-session_summary { background: #f5f3ff; color: #5b21b6; }
.badge-debug { background: #9ca3af; color: #fff; }
.badge-info { background: #3b82f6; color: #fff; }
.badge-warning { background: #f59e0b; color: #fff; }
.badge-error { background: #ef4444; color: #fff; }
.empty { color: var(--text-muted); padding: 2rem; text-align: center; }
.card { border: 1px solid var(--border); border-radius: 4px; padding: 0.75rem; margin-bottom: 0.5rem; background: var(--bg-secondary); }
.card-content { margin-bottom: 0.5rem; }
.card-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.card-actions { display: flex; gap: 0.5rem; }
.btn {
  padding: 0.3rem 0.7rem;
  border: none;
  border-radius: 3px;
  font-size: 0.75rem;
  cursor: pointer;
  font-weight: 600;
}
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.bulk-actions { margin-bottom: 0.75rem; display: flex; gap: 0.5rem; }
.audit-item, .diag-item { padding: 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
.audit-details { cursor: pointer; color: var(--accent); font-size: 0.75rem; }
.audit-json { display: none; white-space: pre-wrap; font-size: 0.7rem; background: var(--bg-secondary); padding: 0.5rem; margin-top: 0.3rem; word-break: break-all; }
#toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
.toast { padding: 0.6rem 1rem; border-radius: 4px; font-size: 0.8rem; color: #fff; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.review-form { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
.review-form label { display: grid; gap: 0.25rem; font-size: 0.8rem; }
.review-form textarea, .review-form input, .review-form select {
  width: 100%; padding: 0.5rem; border: 1px solid var(--border);
  border-radius: 4px; background: var(--bg); color: var(--text); font: inherit;
}
.review-form textarea { min-height: 7rem; resize: vertical; }
.review-form .card-actions { flex-wrap: wrap; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn:hover:not(:disabled) { filter: brightness(0.9); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}
.hint { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; }
.export-file { margin-top: 1rem; }
.export-file pre { padding: 0.75rem; background: var(--bg-secondary); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>OpenMembrane</h1>
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('memories')">Memories</button>
  <button class="tab-btn" onclick="switchTab('pending')" id="pending-tab-btn">Pending</button>
  <button class="tab-btn" onclick="switchTab('audit')">Audit</button>
  <button class="tab-btn" onclick="switchTab('diagnostics')">Diagnostics</button>
  <button class="tab-btn" onclick="switchTab('stale')">Stale memories</button>
  <button class="tab-btn" onclick="switchTab('export')">Export</button>
</div>

<div id="tab-memories" class="tab-content active">
  <div class="filter-row">
    <input type="text" id="mem-search" placeholder="Search..." oninput="loadMemories()">
    <select id="mem-type" onchange="loadMemories()">
      <option value="">All types</option>
      <option value="project_fact">project_fact</option>
      <option value="coding_rule">coding_rule</option>
      <option value="architecture_decision">architecture_decision</option>
      <option value="known_gotcha">known_gotcha</option>
      <option value="testing_rule">testing_rule</option>
      <option value="deployment_rule">deployment_rule</option>
      <option value="security_rule">security_rule</option>
      <option value="forbidden_pattern">forbidden_pattern</option>
      <option value="domain_knowledge">domain_knowledge</option>
      <option value="session_summary">session_summary</option>
    </select>
    <select id="mem-scope" onchange="loadMemories()">
      <option value="">All scopes</option>
      <option value="global">global</option>
      <option value="frontend">frontend</option>
      <option value="backend">backend</option>
      <option value="database">database</option>
      <option value="deployment">deployment</option>
      <option value="testing">testing</option>
      <option value="security">security</option>
      <option value="tooling">tooling</option>
      <option value="unknown">unknown</option>
    </select>
  </div>
  <div class="table-wrap" id="memories-content"></div>
</div>

<div id="tab-pending" class="tab-content">
  <div class="bulk-actions">
    <button class="btn btn-success" onclick="approveAllCandidates()">Approve All</button>
    <button class="btn btn-danger" onclick="rejectAllCandidates()">Reject All</button>
  </div>
  <div id="pending-content"></div>
</div>

<div id="tab-audit" class="tab-content">
  <div id="audit-content"></div>
</div>

<div id="tab-diagnostics" class="tab-content">
  <div class="filter-row">
    <select id="diag-severity" onchange="loadDiagnostics()">
      <option value="">All severities</option>
      <option value="debug">debug</option>
      <option value="info">info</option>
      <option value="warning">warning</option>
      <option value="error">error</option>
    </select>
  </div>
  <div id="diagnostics-content"></div>
</div>

<div id="tab-stale" class="tab-content">
  <p class="hint">Review older memories and edit or supersede rules that no longer apply.</p>
  <form class="filter-row" onsubmit="event.preventDefault(); loadStaleMemories()">
    <label>Older than <input id="stale-months" type="number" min="1" max="120" value="6" required> months</label>
    <button class="btn btn-primary" type="submit">Review memories</button>
  </form>
  <div id="stale-content" aria-live="polite"></div>
</div>

<div id="tab-export" class="tab-content">
  <p class="hint">Preview static instruction files before writing them. Confidential memories are excluded unless you explicitly include them.</p>
  <form class="review-form" onsubmit="event.preventDefault(); exportMemories(true, this)">
    <label>Target
      <select name="target">
        <option value="">All targets</option>
        <option value="agents">AGENTS.md</option>
        <option value="claude">CLAUDE.md</option>
        <option value="copilot">Copilot instructions</option>
        <option value="cursor">Cursor rules</option>
        <option value="project_memory">Project memory</option>
      </select>
    </label>
    <label>Output directory (relative to the project)<input name="outputDir" value="." required></label>
    <label><span><input name="confidential" type="checkbox" style="width:auto"> Include confidential memories in exported files</span></label>
    <div class="card-actions">
      <button class="btn btn-primary" type="submit">Preview files</button>
      <button class="btn" type="button" onclick="exportMemories(false, this.form)">Write files</button>
    </div>
  </form>
  <div id="export-content" aria-live="polite"></div>
</div>

<div id="toast-container" role="status" aria-live="polite"></div>

<script>
const tabsLoaded = { memories: false, pending: false, audit: false, diagnostics: false, stale: false, export: false };

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add('active');
  if (!tabsLoaded[name]) {
    tabsLoaded[name] = true;
    if (name === 'memories') loadMemories();
    else if (name === 'pending') loadCandidates();
    else if (name === 'audit') loadAudit();
    else if (name === 'diagnostics') loadDiagnostics();
    else if (name === 'stale') loadStaleMemories();
  }
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function truncate(str, len = 80) {
  if (!str) return '';
  const escaped = escapeHtml(str);
  return escaped.length > len ? escaped.slice(0, len) + '…' : escaped;
}

function badgeHtml(text, prefix) {
  const safe = escapeHtml(text);
  const cls = prefix ? `badge badge-${safe}` : 'badge';
  return `<span class="${cls}">${safe}</span>`;
}

async function apiRequest(path, options) {
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) {
    const message = typeof data.error === 'string' ? data.error : 'Request failed';
    throw new Error(message + (data.diagnosticId ? ` (diagnostic: ${data.diagnosticId})` : ''));
  }
  return data;
}

function memoryReviewHtml(memory) {
  return `<form class="review-form" data-memory-id="${escapeHtml(memory.id)}" onsubmit="event.preventDefault(); updateMemory(this)">
    <span class="hint">ID: ${escapeHtml(memory.id)}</span>
    <label>Content<textarea name="content" required>${escapeHtml(memory.content)}</textarea></label>
    <label>Type<select name="type">${Array.from(document.getElementById('mem-type').options).filter(o => o.value).map(o =>
      `<option value="${o.value}" ${o.value === memory.type ? 'selected' : ''}>${o.text}</option>`).join('')}</select></label>
    <label>Scope<select name="scope">${Array.from(document.getElementById('mem-scope').options).filter(o => o.value).map(o =>
      `<option value="${o.value}" ${o.value === memory.scope ? 'selected' : ''}>${o.text}</option>`).join('')}</select></label>
    <label>Tags (comma-separated)<input name="tags" value="${escapeHtml((memory.tags || []).join(', '))}"></label>
    <label>Reason for superseding (optional)<input name="reason"></label>
    <label>Replacement memory ID (optional)<input name="replacementId"></label>
    <div class="card-actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <button type="button" class="btn btn-danger" onclick="supersedeMemory(this.form)">Supersede memory</button>
    </div>
  </form>`;
}

async function loadMemories() {
  const q = document.getElementById('mem-search').value;
  const type = document.getElementById('mem-type').value;
  const scope = document.getElementById('mem-scope').value;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (type) params.set('type', type);
  if (scope) params.set('scope', scope);
  try {
    const items = await apiRequest('/api/memories?' + params);
    if (!items.length) {
      document.getElementById('memories-content').innerHTML = '<div class="empty">No memories found</div>';
      return;
    }
    let html = '<table><thead><tr><th>Type</th><th>Scope</th><th>Content</th><th>Confidence</th><th>Tags</th><th>Created</th></tr></thead><tbody>';
    items.forEach((m, i) => {
      html += `<tr>
        <td>${badgeHtml(m.type, true)}</td><td>${escapeHtml(m.scope)}</td><td><button type="button" class="memory-toggle" aria-expanded="false" aria-controls="memory-editor-${i}" aria-label="Review or edit memory: ${escapeHtml(m.content)}" onclick="toggleMemoryEditor(this)">${truncate(m.content)}</button></td>
        <td>${escapeHtml(m.confidence)}</td><td>${escapeHtml((m.tags || []).join(', '))}</td><td>${formatDate(m.createdAt)}</td>
      </tr><tr id="memory-editor-${i}" hidden><td colspan="6">${memoryReviewHtml(m)}<div class="expanded-content">${escapeHtml(m.content)}</div></td></tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('memories-content').innerHTML = html;
  } catch (e) {
    document.getElementById('memories-content').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

function toggleMemoryEditor(button) {
  const row = document.getElementById(button.getAttribute('aria-controls'));
  row.hidden = !row.hidden;
  button.setAttribute('aria-expanded', String(!row.hidden));
}

async function loadCandidates() {
  try {
    const items = await apiRequest('/api/candidates');
    const btn = document.getElementById('pending-tab-btn');
    btn.innerHTML = items.length ? `Pending <span class="badge">${items.length}</span>` : 'Pending';
    if (!items.length) {
      document.getElementById('pending-content').innerHTML = '<div class="empty">No pending candidates</div>';
      return;
    }
    let html = '';
    items.forEach(c => {
      const isSecret = c.sensitivity === 'secret';
      html += `<div class="card">
        <div class="card-content">${escapeHtml(c.content)}</div>
        <div class="card-meta">
          ${badgeHtml(c.type, true)}
          <span>Scope: ${escapeHtml(c.scope || 'unknown')}</span>
          <span>Sensitivity: ${escapeHtml(c.sensitivity)}</span>
          <span>Confidence: ${escapeHtml(c.confidence)}</span>
          ${c.reason ? `<span>Reason: ${escapeHtml(c.reason)}</span>` : ''}
          ${c.recommendedAction ? `<span>Action: ${escapeHtml(c.recommendedAction)}</span>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn btn-success" onclick="approveCandidate('${escapeHtml(c.id)}')" ${isSecret ? 'disabled title="Cannot approve secret candidates"' : ''}>Approve</button>
          <button class="btn btn-danger" onclick="rejectCandidate('${escapeHtml(c.id)}')">Reject</button>
        </div>
      </div>`;
    });
    document.getElementById('pending-content').innerHTML = html;
  } catch (e) {
    document.getElementById('pending-content').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function loadAudit() {
  try {
    const items = await apiRequest('/api/audit?limit=100');
    if (!items.length) {
      document.getElementById('audit-content').innerHTML = '<div class="empty">No audit events</div>';
      return;
    }
    let html = '';
    items.forEach((ev, i) => {
      const details = ev.details ? escapeHtml(JSON.stringify(ev.details, null, 2)) : '';
      html += `<div class="audit-item">
        ${badgeHtml(ev.type || ev.action || '', false)} <strong>${escapeHtml(ev.entityId || ev.memoryId || '')}</strong>
        <span style="color:var(--text-muted);margin-left:0.5rem">${formatDate(ev.createdAt)}</span>
        ${details ? `<div class="audit-details" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='block'?'none':'block'">details &#9656;</div><div class="audit-json">${details}</div>` : ''}
      </div>`;
    });
    document.getElementById('audit-content').innerHTML = html;
  } catch (e) {
    document.getElementById('audit-content').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function loadDiagnostics() {
  const severity = document.getElementById('diag-severity').value;
  const params = new URLSearchParams({ limit: '100' });
  if (severity) params.set('severity', severity);
  try {
    const items = await apiRequest('/api/diagnostics?' + params);
    if (!items.length) {
      document.getElementById('diagnostics-content').innerHTML = '<div class="empty">No diagnostics</div>';
      return;
    }
    let html = '';
    items.forEach(d => {
      html += `<div class="diag-item">
        ${badgeHtml(d.severity, true)} <strong>${escapeHtml(d.code)}</strong> — ${escapeHtml(d.message)}
        <span style="color:var(--text-muted);margin-left:0.5rem">${escapeHtml(d.operation || '')} ${formatDate(d.createdAt)}</span>
      </div>`;
    });
    document.getElementById('diagnostics-content').innerHTML = html;
  } catch (e) {
    document.getElementById('diagnostics-content').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function approveCandidate(id) {
  try {
    await apiRequest(`/api/candidates/${encodeURIComponent(id)}/approve`, { method: 'POST' });
    showToast('Candidate approved', 'success');
    tabsLoaded.pending = false; loadCandidates();
  } catch (e) { showToast(e.message, 'error'); }
}

async function rejectCandidate(id) {
  const reason = window.prompt('Reason for rejection:');
  if (reason === null) return;
  try {
    await apiRequest(`/api/candidates/${encodeURIComponent(id)}/reject`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(reason ? { reason } : {}) });
    showToast('Candidate rejected', 'success');
    tabsLoaded.pending = false; loadCandidates();
  } catch (e) { showToast(e.message, 'error'); }
}

async function approveAllCandidates() {
  try {
    const result = await apiRequest('/api/candidates/approve-all', { method: 'POST' });
    showToast(`Approved ${result.approved}; skipped ${result.skipped.length}`, 'success');
    tabsLoaded.pending = false; loadCandidates();
  } catch (e) { showToast(e.message, 'error'); }
}

async function rejectAllCandidates() {
  const reason = window.prompt('Reason for rejecting all:');
  if (reason === null) return;
  try {
    await apiRequest('/api/candidates/reject-all', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(reason ? { reason } : {}) });
    showToast('All candidates rejected', 'success');
    tabsLoaded.pending = false; loadCandidates();
  } catch (e) { showToast(e.message, 'error'); }
}

async function loadStaleMemories() {
  const target = document.getElementById('stale-content');
  target.textContent = 'Loading older memories...';
  try {
    const months = document.getElementById('stale-months').value;
    const items = await apiRequest('/api/memories/stale?staleAfterMonths=' + encodeURIComponent(months));
    const active = items.filter(m => m.status === 'active');
    target.innerHTML = active.length
      ? active.map(m => `<details class="card"><summary>${escapeHtml(m.content)} — updated ${formatDate(m.updatedAt)}</summary>${memoryReviewHtml(m)}</details>`).join('')
      : '<div class="empty">No active memories older than this threshold. Try a shorter interval.</div>';
  } catch (e) { target.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
}

async function mutateMemory(form, supersede) {
  if (supersede && !window.confirm('Supersede this memory? It will no longer appear in active context.')) return;
  const buttons = form.querySelectorAll('button');
  buttons.forEach(button => { button.disabled = true; });
  const fields = new FormData(form);
  const input = supersede
    ? { ...(fields.get('reason') ? { reason: fields.get('reason') } : {}), ...(fields.get('replacementId') ? { replacementId: fields.get('replacementId') } : {}) }
    : { content: fields.get('content'), type: fields.get('type'), scope: fields.get('scope'), tags: String(fields.get('tags')).split(',').map(t => t.trim()).filter(Boolean) };
  try {
    const result = await apiRequest('/api/memories/' + encodeURIComponent(form.dataset.memoryId) + (supersede ? '/supersede' : ''), {
      method: supersede ? 'POST' : 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input),
    });
    showToast(result.kind ? `Team publication: ${result.kind}` : supersede ? 'Memory superseded' : 'Memory updated', 'success');
    tabsLoaded.audit = false; tabsLoaded.export = false;
    await Promise.all([loadMemories(), loadStaleMemories()]);
  } catch (e) { showToast(e.message, 'error'); }
  finally { buttons.forEach(button => { button.disabled = false; }); }
}

function updateMemory(form) { return mutateMemory(form, false); }
function supersedeMemory(form) { return mutateMemory(form, true); }

async function exportMemories(preview, form) {
  if (!preview && !window.confirm('Write static files to the selected directory? Existing generated files will be overwritten.')) return;
  const target = document.getElementById('export-content');
  const fields = new FormData(form);
  const buttons = form.querySelectorAll('button');
  buttons.forEach(button => { button.disabled = true; });
  target.textContent = preview ? 'Rendering preview...' : 'Writing files...';
  try {
    const result = await apiRequest(preview ? '/api/export/preview' : '/api/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...(fields.get('target') ? { targets: [fields.get('target')] } : {}),
        outputDir: fields.get('outputDir'), includeConfidential: fields.has('confidential'),
      }),
    });
    target.innerHTML = `<p class="hint">${preview ? 'Preview only. No files were written.' : 'Files written.'}</p>` + result.files.map(file =>
      `<details class="export-file" open><summary>${escapeHtml(file.path)} (${file.memoryCount} ${file.memoryCount === 1 ? 'memory' : 'memories'})</summary><pre>${escapeHtml(file.content)}</pre></details>`).join('');
  } catch (e) { target.textContent = e.message; }
  finally { buttons.forEach(button => { button.disabled = false; }); }
}

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// Initial load
tabsLoaded.memories = true;
loadMemories();
</script>
</body>

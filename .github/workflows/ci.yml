name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check storage boundaries, types, and tests
        run: npm run check

      - name: Build OpenCode plugin
        run: npm run build -w @openmembrane/adapter-opencode

      - name: Build Claude Code adapter
        run: npm run build -w @openmembrane/adapter-claude-code

      - name: Build Codex adapter
        run: npm run build -w @openmembrane/adapter-codex

      - name: Test VS Code extension host
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run test:host -w packages/adapter-vscode

      - name: Test VS Code extension host (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a npm run test:host -w packages/adapter-vscode

      - name: Package VS Code extension
        run: npm run package -w packages/adapter-vscode
